name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # The whole pipeline (install, build, lint, unit, e2e, package) fits well
    # under this when healthy; a hung or crawling e2e run must not burn an
    # hour of runner time.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./desktop-app

    strategy:
      matrix:
        os: [macos-latest]
      fail-fast: false

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !env.ACT && 'yarn' || '' }} # Disable cache for nektos/act
          cache-dependency-path: ./desktop-app/yarn.lock

      - name: yarn install
        run: |
          yarn install --network-timeout 120000

      - name: Build
        run: yarn run build

      - name: Lint, typecheck and unit test
        run: |
          yarn run lint
          yarn exec tsc
          yarn test

      - name: MCP bootstrap package tests
        working-directory: ./responsively-mcp
        run: npm test

      # Instrumentation for the Session-stop flake (throwaway branch, never merged):
      # a read-only watcher records each runtime's port-close and exit timing,
      # process state, CPU, memory pressure and swap, and samples a slow exit.
      - name: Start stop-timing watcher
        run: |
          mkdir -p "$RUNNER_TEMP/stop-watch"
          nohup node scripts/ci/stop-watcher.js "$RUNNER_TEMP/stop-watch" > "$RUNNER_TEMP/stop-watch/watcher.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/stop-watch/watcher.pid"

      - name: E2E Tests
        timeout-minutes: 15
        run: yarn test:e2e
        env:
          CI: true
          E2E_TEST: true
          E2E_HEADLESS: true

      - name: Stop the watcher and collect the controller log
        if: always()
        run: |
          kill -TERM "$(cat "$RUNNER_TEMP/stop-watch/watcher.pid")" || true
          sleep 3
          cp ~/Library/Logs/ResponsivelyApp/main.log "$RUNNER_TEMP/stop-watch/controller-main.log" || true

      - name: Upload stop-timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stop-watch
          path: ${{ runner.temp }}/stop-watch/
          retention-days: 14

      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: desktop-app/playwright-report/
          retention-days: 14

  # Packaging is independent of the test pipeline — running it as its own job
  # takes ~4 minutes off the serial path and keeps an e2e failure from hiding
  # whether the app still packages (and vice versa).
  package:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ./desktop-app

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ${{ !env.ACT && 'yarn' || '' }} # Disable cache for nektos/act
          cache-dependency-path: ./desktop-app/yarn.lock

      - name: yarn install
        run: |
          yarn install --network-timeout 120000

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn run package
