name: Validate MCP bootstrap

on:
  pull_request:
    paths:
      - 'responsively-mcp/**'
      - '.github/workflows/validate-mcp-bootstrap.yml'
  push:
    branches:
      - main
    paths:
      - 'responsively-mcp/**'
      - '.github/workflows/validate-mcp-bootstrap.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: responsively-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm pack --dry-run
